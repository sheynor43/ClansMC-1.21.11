# ClansMC — русский языковой файл.
# Значения в формате MiniMessage. Плейсхолдеры: <player>, <clan>, <tag>, <amount>.
# Значение может быть строкой или списком строк. Отсутствующие ключи берутся из en.yml.
# Не меняйте 'lang-version' — по нему плагин предупреждает о новых ключах.
lang-version: 1

# Слово, которым игрок отменяет диалог создания клана и подтверждения.
cancel-word: отмена

prefix: "<gray>[<aqua>Кланы</aqua>]</gray> "

general:
  reload-success: "<prefix><green>Конфигурация и языки перезагружены."
  no-permission: "<prefix><red>У вас нет прав на это действие."
  players-only: "<prefix><red>Эту команду может использовать только игрок."
  unknown-clan: "<prefix><red>Клан с названием «<clan>» не найден."
  unknown-player: "<prefix><red>Игрок «<player>» не найден."
  player-offline: "<prefix><red>Игрок «<player>» сейчас не в сети."
  number-invalid: "<prefix><red>«<input>» — не число."
  usage: "<prefix><yellow>Использование: <gray><usage>"

clan:
  not-in-clan: "<prefix><red>Вы не состоите в клане."
  already-in-clan: "<prefix><red>Вы уже состоите в клане."
  target-already-in-clan: "<prefix><red><player> уже состоит в клане."
  target-not-in-your-clan: "<prefix><red><player> не состоит в вашем клане."
  only-leader: "<prefix><red>Это может сделать только лидер клана."
  leader-cannot-leave: "<prefix><red>Лидер не может выйти. Используйте <white>/clan transfer</white> или <white>/clan disband</white>."
  member-limit-reached: "<prefix><red>Клан достиг лимита участников (<amount>)."
  created: "<prefix><green>Клан <white><clan> <gray>[<tag_colored><gray>]</gray> <green>создан!"
  member-joined: "<prefix><green><player> вступил в клан."
  member-left: "<prefix><yellow><player> покинул клан."
  you-left: "<prefix><yellow>Вы покинули клан <white><clan></white>."
  you-were-kicked: "<prefix><red>Вас исключили из клана <white><clan></white>."
  member-kicked: "<prefix><yellow><player> исключён из клана."
  cannot-kick-self: "<prefix><red>Нельзя исключить себя. Используйте <white>/clan disband</white> или <white>/clan transfer</white>."
  transferred: "<prefix><green>Лидерство передано игроку <white><player></white>."
  transfer-received: "<prefix><green>Теперь вы лидер клана <white><clan></white>."
  disbanded: "<prefix><yellow>Клан <white><clan></white> расформирован."
  join-broadcast: "<prefix><gray><player> зашёл на сервер."
  quit-broadcast: "<prefix><gray><player> вышел с сервера."
  confirm-disband:
    - "<prefix><red>Расформировать клан <white><clan></white>? Это необратимо."
    - "<prefix><click:run_command:'/clan disband confirm'><green><bold>[Подтвердить]</bold></green></click>  <click:run_command:'/clan cancel'><red>[Отмена]</red></click>"
  confirm-transfer:
    - "<prefix><yellow>Передать лидерство в клане <white><clan></white> игроку <white><player></white>?"
    - "<prefix><click:run_command:'/clan transfer <player> confirm'><green><bold>[Подтвердить]</bold></green></click>  <click:run_command:'/clan cancel'><red>[Отмена]</red></click>"
  cancelled: "<prefix><gray>Отменено."
  info:
    header: "<gray><strikethrough>                    </strikethrough> <white><clan> <gray>[<tag_colored><gray>]</gray> <gray><strikethrough>                    </strikethrough>"
    leader: "<gray>Лидер: <white><player>"
    level: "<gray>Уровень: <white><level> <gray>(<white><xp><gray>/<white><xp_next><gray> опыта)"
    level-max: "<gray>Уровень: <white><level> <gray>(макс.)"
    created: "<gray>Основан: <white><date>"
    members: "<gray>Участники: <white><online> в сети<gray>/<white><total> всего"
    members-list: "<gray>  <white><names>"
    bank: "<gray>Банк: <white><amount>"
    allies: "<gray>Союзники: <white><allies>"
    enemies: "<gray>Враги: <white><enemies>"
    stats: "<gray>Убийства боссов: <white>Визер <amount_wither> <gray>| <white>Дракон <amount_dragon>"
    none: "<dark_gray>нет"
  list:
    header: "<gray>Кланы — страница <white><page><gray>/<white><pages>"
    line: "<gray> • <white><clan> <gray>[<tag_colored><gray>]</gray> <dark_gray>— <white><members> <gray>уч., уровень <white><level>"
    empty: "<prefix><gray>Кланов пока нет."
    footer: "<gray>Используйте <white>/clan list <page></white> для следующих."
  members:
    header: "<gray>Участники клана <white><clan></white>:"
    online: "<gray> • <green><player> <dark_gray>(<white><role><dark_gray>)"
    offline: "<gray> • <dark_gray><player> (<role>)"

create:
  intro: "<prefix><gray>Начато создание клана. Напишите <white>«<cancel>»</white> в любой момент для отмены."
  prompt-name:
    - "<prefix><yellow>Шаг 1/3 — введите <white>название</white> клана в чат."
    - "<prefix><gray>3–16 символов, пробелы разрешены.  <click:run_command:'/clan cancel'><red>[Отмена]</red></click>"
  prompt-tag:
    - "<prefix><yellow>Шаг 2/3 — введите <white>тег</white> клана (одно слово)."
    - "<prefix><gray><min>–<max> символов, только буквы и цифры.  <click:run_command:'/clan cancel'><red>[Отмена]</red></click>"
  confirm:
    - "<prefix><yellow>Шаг 3/3 — создать <white><clan> <gray>[<tag_colored><gray>]</gray><yellow>?"
    - "<prefix><click:run_command:'/clan create-confirm'><green><bold>[Подтвердить]</bold></green></click>  <click:run_command:'/clan cancel'><red>[Отмена]</red></click>"
  timed-out: "<prefix><red>Время создания клана истекло."
  cancelled: "<prefix><gray>Создание клана отменено."
  errors:
    name-length: "<prefix><red>Название должно быть <white><min>–<max></white> символов. Попробуйте снова."
    name-blacklisted: "<prefix><red>Такое название запрещено. Выберите другое."
    name-taken: "<prefix><red>Клан с названием «<clan>» уже существует. Выберите другое."
    tag-format: "<prefix><red>Тег — одно слово из букв и цифр. Попробуйте снова."
    tag-length: "<prefix><red>Тег должен быть <white><min>–<max></white> символов. Попробуйте снова."
    tag-taken: "<prefix><red>Тег «<tag>» уже занят. Выберите другой."

invite:
  sent: "<prefix><green>Приглашение отправлено игроку <white><player></white>."
  antispam: "<prefix><red>Вы недавно приглашали <white><player></white>. Подождите немного."
  received:
    - "<prefix><green>Вас пригласили в клан <white><clan> <gray>[<tag_colored><gray>]</gray><green>."
    - "<prefix><hover:show_text:'<green>Вступить в <clan>'><click:run_command:'/clan accept <tag>'><green><bold>[Принять]</bold></green></click></hover>  <hover:show_text:'<red>Отклонить'><click:run_command:'/clan deny <tag>'><red>[Отклонить]</red></click></hover>"
  accepted-self: "<prefix><green>Вы вступили в клан <white><clan></white>."
  accepted-broadcast: "<prefix><green><player> принял приглашение."
  denied-self: "<prefix><gray>Вы отклонили приглашение от <white><clan></white>."
  denied-broadcast: "<prefix><gray><player> отклонил приглашение."
  none-pending: "<prefix><gray>У вас нет активных приглашений."
  no-such-invite: "<prefix><red>У вас нет приглашения от «<clan>»."
  expired: "<prefix><gray>Приглашение от <white><clan></white> истекло."
  list-header: "<gray>Активные приглашения:"
  list-line: "<gray> • <white><clan> <gray>[<tag_colored><gray>]</gray>  <click:run_command:'/clan accept <tag>'><green>[Принять]</green></click> <click:run_command:'/clan deny <tag>'><red>[Отклонить]</red></click>"

chat:
  format: "<dark_aqua>[Клан]</dark_aqua> <white><player><gray>: <gray><message>"
  toggle-on: "<prefix><green>Клан-чат включён. Все ваши сообщения уходят в клан."
  toggle-off: "<prefix><gray>Клан-чат выключен."
  no-message: "<prefix><yellow>Использование: <white>/cc <сообщение>"

boss:
  wither-name: "Визера"
  dragon-name: "Дракона Края"
  reward: "<prefix><gold>Ваш клан убил <white><boss></white>! Каждый участник получил <white><amount></white> опыта."
  reward-clan-xp: "<prefix><gold>Клан получил <white><amount></white> кланового опыта."

