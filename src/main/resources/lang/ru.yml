  enemy-removed: "<prefix><yellow>Вы больше не воюете с кланом <white><clan></white>."
  enemy-already: "<prefix><red><clan> уже ваш враг."
  cannot-self: "<prefix><red>Нельзя устанавливать отношения с собственным кланом."
  conflict: "<prefix><red>Клан не может быть одновременно союзником и врагом."
  no-relation: "<prefix><gray>У вас нет таких отношений с кланом <white><clan></white>."

