  ally-formed: "<prefix><green>Вы заключили союз с кланом <white><clan></white>."
  ally-removed: "<prefix><yellow>Союз с кланом <white><clan></white> расторгнут."
  ally-limit: "<prefix><red>Ваш клан не может иметь больше <white><amount></white> союзов на этом уровне."
  ally-already: "<prefix><red>Вы уже в союзе с кланом <white><clan></white>."
  enemy-declared: "<prefix><red>Вы объявили клан <white><clan></white> врагом."
