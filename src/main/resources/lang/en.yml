# ClansMC — English language file.
# Values are MiniMessage. Placeholders look like <player>, <clan>, <tag>, <amount>.
# A value may be a single line or a list of lines. Missing keys fall back to this file.
# Do not change 'lang-version'; it lets the plugin warn you when new keys are added.
lang-version: 1

# The single word a player types to abort the /clan create dialog and confirmations.
cancel-word: cancel

# Prefix reused by most messages via <prefix>.
prefix: "<gray>[<aqua>Clans</aqua>]</gray> "

general:
  reload-success: "<prefix><green>Configuration and languages reloaded."
  no-permission: "<prefix><red>You don't have permission to do that."
  players-only: "<prefix><red>Only players can use this command."
  unknown-clan: "<prefix><red>No clan named '<clan>' exists."
  unknown-player: "<prefix><red>Player '<player>' was not found."
  player-offline: "<prefix><red>Player '<player>' is offline."
  number-invalid: "<prefix><red>'<input>' is not a valid number."
  usage: "<prefix><yellow>Usage: <gray><usage>"

clan:
  not-in-clan: "<prefix><red>You are not in a clan."
  already-in-clan: "<prefix><red>You are already in a clan."
  target-already-in-clan: "<prefix><red><player> is already in a clan."
  target-not-in-your-clan: "<prefix><red><player> is not in your clan."
  only-leader: "<prefix><red>Only the clan leader can do that."
  leader-cannot-leave: "<prefix><red>The leader cannot leave. Use <white>/clan transfer</white> or <white>/clan disband</white>."
  member-limit-reached: "<prefix><red>Your clan has reached its member limit (<amount>)."
  created: "<prefix><green>Clan <white><clan> <gray>[<tag_colored><gray>]</gray> <green>created!"
  member-joined: "<prefix><green><player> joined the clan."
  member-left: "<prefix><yellow><player> left the clan."
  you-left: "<prefix><yellow>You left <white><clan></white>."
  you-were-kicked: "<prefix><red>You were kicked from <white><clan></white>."
  member-kicked: "<prefix><yellow><player> was kicked from the clan."
  cannot-kick-self: "<prefix><red>You cannot kick yourself. Use <white>/clan disband</white> or <white>/clan transfer</white>."
  transferred: "<prefix><green>Leadership transferred to <white><player></white>."
  transfer-received: "<prefix><green>You are now the leader of <white><clan></white>."
  disbanded: "<prefix><yellow>Clan <white><clan></white> was disbanded."
  join-broadcast: "<prefix><gray><player> connected."
  quit-broadcast: "<prefix><gray><player> disconnected."
  confirm-disband:
    - "<prefix><red>Disband <white><clan></white>? This cannot be undone."
    - "<prefix><click:run_command:'/clan disband confirm'><green><bold>[Confirm]</bold></green></click>  <click:run_command:'/clan cancel'><red>[Cancel]</red></click>"
  confirm-transfer:
    - "<prefix><yellow>Transfer leadership of <white><clan></white> to <white><player></white>?"
    - "<prefix><click:run_command:'/clan transfer <player> confirm'><green><bold>[Confirm]</bold></green></click>  <click:run_command:'/clan cancel'><red>[Cancel]</red></click>"
  cancelled: "<prefix><gray>Cancelled."
  info:
    header: "<gray><strikethrough>                    </strikethrough> <white><clan> <gray>[<tag_colored><gray>]</gray> <gray><strikethrough>                    </strikethrough>"
    leader: "<gray>Leader: <white><player>"
    level: "<gray>Level: <white><level> <gray>(<white><xp><gray>/<white><xp_next><gray> XP)"
    level-max: "<gray>Level: <white><level> <gray>(max)"
    created: "<gray>Founded: <white><date>"
    members: "<gray>Members: <white><online> online<gray>/<white><total> total"
    members-list: "<gray>  <white><names>"
    bank: "<gray>Bank: <white><amount>"
    allies: "<gray>Allies: <white><allies>"
    enemies: "<gray>Enemies: <white><enemies>"
    stats: "<gray>Boss kills: <white>Wither <amount_wither> <gray>| <white>Dragon <amount_dragon>"
    none: "<dark_gray>none"
  list:
    header: "<gray>Clans — page <white><page><gray>/<white><pages>"
    line: "<gray> • <white><clan> <gray>[<tag_colored><gray>]</gray> <dark_gray>— <white><members> <gray>members, level <white><level>"
    empty: "<prefix><gray>No clans exist yet."
    footer: "<gray>Use <white>/clan list <page></white> for more."
  members:
    header: "<gray>Members of <white><clan></white>:"
    online: "<gray> • <green><player> <dark_gray>(<white><role><dark_gray>)"
    offline: "<gray> • <dark_gray><player> (<role>)"

create:
  intro: "<prefix><gray>Interactive clan creation started. Type <white>'<cancel>'</white> at any time to abort."
  prompt-name:
    - "<prefix><yellow>Step 1/3 — type your clan <white>name</white> in chat."
    - "<prefix><gray>3–16 characters, spaces allowed.  <click:run_command:'/clan cancel'><red>[Cancel]</red></click>"
  prompt-tag:
    - "<prefix><yellow>Step 2/3 — type your clan <white>tag</white> (one word)."
    - "<prefix><gray><min>–<max> characters, letters and digits only.  <click:run_command:'/clan cancel'><red>[Cancel]</red></click>"
  confirm:
    - "<prefix><yellow>Step 3/3 — create <white><clan> <gray>[<tag_colored><gray>]</gray><yellow>?"
    - "<prefix><click:run_command:'/clan create-confirm'><green><bold>[Confirm]</bold></green></click>  <click:run_command:'/clan cancel'><red>[Cancel]</red></click>"
  timed-out: "<prefix><red>Clan creation timed out."
  cancelled: "<prefix><gray>Clan creation cancelled."
  errors:
    name-length: "<prefix><red>The name must be <white><min>–<max></white> characters. Try again."
    name-blacklisted: "<prefix><red>That name is not allowed. Try another."
    name-taken: "<prefix><red>A clan named '<clan>' already exists. Try another."
    tag-format: "<prefix><red>The tag must be one word of letters/digits. Try again."
    tag-length: "<prefix><red>The tag must be <white><min>–<max></white> characters. Try again."
    tag-taken: "<prefix><red>The tag '<tag>' is already taken. Try another."

invite:
  sent: "<prefix><green>Invitation sent to <white><player></white>."
  antispam: "<prefix><red>You invited <white><player></white> too recently. Wait a moment."
  received:
    - "<prefix><green>You have been invited to <white><clan> <gray>[<tag_colored><gray>]</gray><green>."
    - "<prefix><hover:show_text:'<green>Join <clan>'><click:run_command:'/clan accept <tag>'><green><bold>[Accept]</bold></green></click></hover>  <hover:show_text:'<red>Decline'><click:run_command:'/clan deny <tag>'><red>[Decline]</red></click></hover>"
  accepted-self: "<prefix><green>You joined <white><clan></white>."
  accepted-broadcast: "<prefix><green><player> accepted the invitation."
  denied-self: "<prefix><gray>You declined the invitation from <white><clan></white>."
  denied-broadcast: "<prefix><gray><player> declined the invitation."
  none-pending: "<prefix><gray>You have no pending invitations."
  no-such-invite: "<prefix><red>You have no pending invitation from '<clan>'."
  expired: "<prefix><gray>The invitation from <white><clan></white> expired."
  list-header: "<gray>Pending invitations:"
  list-line: "<gray> • <white><clan> <gray>[<tag_colored><gray>]</gray>  <click:run_command:'/clan accept <tag>'><green>[Accept]</green></click> <click:run_command:'/clan deny <tag>'><red>[Deny]</red></click>"

chat:
  format: "<dark_aqua>[Clan]</dark_aqua> <white><player><gray>: <gray><message>"
  toggle-on: "<prefix><green>Clan chat enabled. Everything you type goes to your clan."
  toggle-off: "<prefix><gray>Clan chat disabled."
  no-message: "<prefix><yellow>Usage: <white>/cc <message>"

boss:
  wither-name: "the Wither"
  dragon-name: "the Ender Dragon"
  reward: "<prefix><gold>Your clan slayed <white><boss></white>! Each contributor received <white><amount></white> XP."
  reward-clan-xp: "<prefix><gold>Clan gained <white><amount></white> clan XP."

relations:
  ally-requested: "<prefix><green>Alliance offered to <white><clan></white>. Waiting for their confirmation."
  ally-request-received:
    - "<prefix><green><clan> offers you an alliance."
    - "<prefix><click:run_command:'/clan ally <tag>'><green><bold>[Accept]</bold></green></click>  <click:run_command:'/clan unally <tag>'><red>[Decline]</red></click>"
  ally-formed: "<prefix><green>You are now allied with <white><clan></white>."
  ally-removed: "<prefix><yellow>Your alliance with <white><clan></white> has ended."
  ally-limit: "<prefix><red>Your clan cannot have more than <white><amount></white> allies at this level."
  ally-already: "<prefix><red>You are already allied with <white><clan></white>."
  enemy-declared: "<prefix><red>You declared <white><clan></white> an enemy."
  enemy-received: "<prefix><red><clan> has declared your clan an enemy."
  enemy-removed: "<prefix><yellow>You are no longer at war with <white><clan></white>."
  enemy-already: "<prefix><red><clan> is already your enemy."
  cannot-self: "<prefix><red>You cannot set a relation with your own clan."
  conflict: "<prefix><red>A clan cannot be an ally and an enemy at the same time."
  no-relation: "<prefix><gray>You have no such relation with <white><clan></white>."

bank:
  disabled: "<prefix><red>The clan bank is disabled on this server."
  balance: "<prefix><gray>Clan bank: <white><amount></white> <gray>(capacity <white><capacity></white>)."
  deposited: "<prefix><green>Deposited <white><amount></white>. New balance: <white><balance></white>."
  withdrew: "<prefix><green>Withdrew <white><amount></white>. New balance: <white><balance></white>."
  not-enough-personal: "<prefix><red>You don't have <white><amount></white> to deposit."
  not-enough-bank: "<prefix><red>The clan bank doesn't have <white><amount></white>."
  capacity-exceeded: "<prefix><red>That deposit would exceed the bank capacity of <white><capacity></white>."
  amount-positive: "<prefix><red>The amount must be positive."

glow:
  disabled: "<prefix><red>Clan glow is disabled on this server."
  locked: "<prefix><red>Your clan must reach a higher level to unlock glow."
  enabled: "<prefix><green>Clan glow enabled. <gray>(Note: visible to everyone, not only clan mates.)"
  disabled-now: "<prefix><gray>Clan glow disabled."

